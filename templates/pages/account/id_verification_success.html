{% extends 'layouts/base.html' %}

{% load static %}

{% block title %}StudentPeeps | Verification Email{% endblock %}

{% block linkshead %}
<style>


    .btn-primary {
        font-weight: bold;
        height: 40px;
        line-height: 1.5rem;
        padding: 0 1rem;
        width: 100%;
        border: 0;
        border-radius: 0.5rem;
        background-image: linear-gradient(131deg, #bb91e4, #a672da, #ab81d5, #9245df);
        background-size: 300% 100%;
        transition: all 0.3s ease-in-out;
        color: white;
    }

    #re-enter {
        background: var(--primary);
        color: #fff;
        border: 2px solid var(--primary);
        font-weight: 500;
        height: 40px;
        line-height: 1.5rem;
        padding: 0 1rem;
        width: 100% !important;
    }

    #use-id {
        background: white;
        color: var(--primary);
        border: 2px solid var(--primary);
        font-weight: 600;
        height: 40px;
        line-height: 1.5rem;
        padding: 0 1rem;
        width: 100% !important;
    }

    @media screen and (max-width:520px) {
        #buttons {
            display: flex;
            flex-direction: column;
        }   
    }

    #notreceive {
        background: none;
        text-decoration: none;
        color: rgb(28, 189, 207);
        font-size: 1em;
    }

    #notreceive:hover {
        text-decoration: underline;
    }

    .another {
        font-weight: bold;
        height: 40px;
        line-height: 2.5rem;
        padding: 0 3rem;
        width: 100% !important;
        transition: all 0.3s ease-in-out;
        border: 1px solid #9245df;
        color: #9245df;
    }

    .another:hover {
        box-shadow: 0 0.5em 0.5em -0.4em #a044fd;
        background-size: 100% 100%;
        transform: translateY(-0.15em);
        background-color: #b36ef8;
        border: 1px solid #9245df;
    }
    body {
        background-image: url("/static/images/illustrator_signup.webp");
        background-repeat: no-repeat;
    }

    @media (max-width:786px) {
        body {
            background-image: url(""); 
        }
    }
</style>
{% endblock %}

{% block body %}
<div class="verify-success-page">
    <div class="verify-success-card">
        <img style="width: 70%; max-width: 280px; margin: 0 auto;" src="https://vc-thumbnails.blr1.cdn.digitaloceanspaces.com/studentpeeps/logos/tickanimation.gif" alt="">

        <h2>Welcome to Studentpeeps</h2>
        <p>Your Student ID is verified.</p>
        <p>Thanks for signup!</p>

        <a href="/all" class="btn btn-p btn-blk">Explore Student Discounts</a>
    </div>
</div>


<script>
    function PointShow() {
        var dataShow = document.getElementById("datashow");

        if (dataShow.style.display == "none") {
            dataShow.style.display = "block";
        }

        else {
            dataShow.style.display = "none";
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>
{% endblock %}
