<style>
    .product-card {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    .product-image {
        width: 100%;
        height: 130px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: #999;
        padding: 10px;
    }

    .product-image img {
        border-radius: 4px;
        object-fit: fill;
        height: fit-content;
        padding: 1px;
    }


    .tag {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.65rem;
        font-weight: 600;
        margin-right: 8px;
    }

    .tag-recommended {
        background: #E0F7F4;
        color: #00BFA5;
    }

    .tag-instant {
        background: #F5F5F5;
        color: #666;
    }
</style>


<a href="{{ offer.link }}" class="giftcard">
    <div class="product-card">
        <div class="product-image">
            {% if offer.thumbnail %}
            <img src="{{ offer.thumbnail }}" alt="{{ offer.title }}" />
            {% else %}
            <img src="{{ offer.thumbnail_image.url }}" alt="{{ offer.title }}" />
            {% endif %}
        </div>
        <div class="p-2 pb-4">
            <div class="mb-3">
                <span class="tag tag-recommended">Recommended</span>
                <span class="tag tag-instant">Instant</span>
            </div>
            <h3 class="font-semibold text-gray-900 text-sm pl-1 truncate">
                {{ offer.brand.name|default:offer.title }}
            </h3>
        </div>
    </div>
</a>
