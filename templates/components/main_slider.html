<style>
    /* Added carousel styles */
    .carousel-container {
        position: relative;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        border-radius: 12px;
    }

    .carousel-wrapper {
        display: flex;
        transition: transform 0.5s ease-in-out;
    }

    .carousel-slide {
        min-width: 100%;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-size: cover;
        background-position: center;
        position: relative;
        background: #f5f5f5;
    }

    @media (max-width: 768px) {
        .carousel-slide {
            height: 250px;
        }
    }

    @media (max-width: 480px) {
        .carousel-slide {
            height: 200px;
        }
    }

    .carousel-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.3);
        hover: rgba(255, 255, 255, 0.5);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        z-index: 20;
        transition: background 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .carousel-nav-btn:hover {
        background: rgba(255, 255, 255, 0.5);
    }

    .carousel-nav-btn.prev {
        left: 20px;
    }

    .carousel-nav-btn.next {
        right: 20px;
    }

    @media (max-width: 480px) {
        .carousel-nav-btn {
            width: 32px;
            height: 32px;
            font-size: 18px;
        }

        .carousel-nav-btn.prev {
            left: 10px;
        }

        .carousel-nav-btn.next {
            right: 10px;
        }
    }

    .carousel-indicators {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 20;
    }

    .carousel-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition: background 0.3s ease;
        border: none;
    }

    .carousel-dot.active {
        background: rgba(255, 255, 255, 0.9);
    }

    @media (max-width: 480px) {
        .carousel-dot {
            width: 10px;
            height: 10px;
        }

        .carousel-indicators {
            bottom: 15px;
            gap: 8px;
        }
    }

    /* added new style for carousel images */
    .carousel-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
</style>

<!-- Replaced static hero banner with carousel -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
    <div class="carousel-container">
        <div class="carousel-wrapper" id="carouselWrapper">
            {% for img in images %}
            <div class="carousel-slide">
                <img src="{{ img }}" alt="Banner {{ forloop.counter }}" class="carousel-image">
            </div>
            {% endfor %}
        </div>

        <!-- Navigation buttons -->
        <button class="carousel-nav-btn prev" onclick="prevSlide()">‹</button>
        <button class="carousel-nav-btn next" onclick="nextSlide()">›</button>

        <!-- Indicators -->
        <!-- <div class="carousel-indicators" id="indicators"></div> -->
    </div>
</div>


<!-- Added carousel JavaScript functionality -->
<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.carousel-slide');
    const totalSlides = slides.length;
    let autoplayInterval;

    function initCarousel() {
        createIndicators();
        updateCarousel();
        startAutoplay();
    }

    function createIndicators() {
        const indicatorsContainer = document.getElementById('indicators');
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('button');
            dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
            dot.onclick = () => goToSlide(i);
            indicatorsContainer.appendChild(dot);
        }
    }

    function updateCarousel() {
        const wrapper = document.getElementById('carouselWrapper');
        wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;

        const dots = document.querySelectorAll('.carousel-dot');
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentSlide);
        });
    }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % totalSlides;
        updateCarousel();
        resetAutoplay();
    }

    function prevSlide() {
        currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
        updateCarousel();
        resetAutoplay();
    }

    function goToSlide(index) {
        currentSlide = index;
        updateCarousel();
        resetAutoplay();
    }

    function startAutoplay() {
        autoplayInterval = setInterval(() => {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        }, 5000);
    }

    function resetAutoplay() {
        clearInterval(autoplayInterval);
        startAutoplay();
    }

    document.addEventListener('DOMContentLoaded', initCarousel);
</script>
