<a href="{{ offer.link }}" class="brand-offer-tile-link">
    <article class="brand-offer-tile">
        <div class="brand-offer-tile__media">
            <img src="{{ offer.thumbnail_image.url }}" alt="{{ offer.title }}">

            <div class="brand-offer-tile__brand">
                <div class="brand-offer-tile__logo">
                    <img src="{{ offer.brand.logo.url }}" alt="{{ offer.brand.name }}">
                </div>
                <p class="brand-offer-tile__name">{{ offer.brand.name }}</p>
            </div>
        </div>

        <div class="brand-offer-tile__body">
            <h3>{{ offer.title }}</h3>
            <p>{{ offer.subtitle }}</p>
        </div>
    </article>
</a>
