<style>
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }

    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
</style>

<div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8  pt-8">

    <h2 class="text-[24px] font-bold text-black pb-2">
        {{ content.title }}
    </h2>

    {% if content.offers|length > 5 %}
    <!-- LEFT ARROW -->
    <button id="slideLeft"
        class="absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-white shadow-md w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-200">
        ‹
    </button>
    {% endif %}

    <!-- SLIDER -->
    <div id="offerSlider" class="flex gap-6 overflow-x-auto scroll-smooth py-6 no-scrollbar px-1">
        {% for offer in content.offers %}
            <div class="flex-none basis-1/5 min-w-[20%]">
                {% include "components/tiles_cardV2.html" %}
            </div>
        {% endfor %}


    </div>

    {% if content.offers|length > 5 %}
    <!-- RIGHT ARROW -->
    <button id="slideRight"
        class="absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-white shadow-md w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-200">
        ›
    </button>
    {% endif %}
</div>

<script>
    const slider = document.getElementById("offerSlider");
    const left = document.getElementById("slideLeft");
    const right = document.getElementById("slideRight");

    function scrollByTiles(count) {
        const firstTile = slider.querySelector(":scope > *");
        if (!firstTile) return 0;

        const rect = firstTile.getBoundingClientRect();
        const style = getComputedStyle(slider);
        const gap = parseFloat(style.columnGap || style.gap || 0);

        return (rect.width + gap) * count;
    }

    if (left) {
        left.addEventListener("click", () => {
            slider.scrollBy({ left: -scrollByTiles(5), behavior: "smooth" });
        });
    }

    if (right) {
        right.addEventListener("click", () => {
            slider.scrollBy({ left: scrollByTiles(5), behavior: "smooth" });
        });
    }
</script>
