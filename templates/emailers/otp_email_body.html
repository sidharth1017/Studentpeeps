<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Your UNiDAYS Passcode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>


        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            font-weight: bold;
            font-size: 26px;
            color: #000;
            letter-spacing: 1px;
        }

        .logo img {
            width: 50%;
        }

        .subtitle {
            font-size: 22px;
            color: #333;
            margin: 10px 0 30px;
            font-weight: bolder;
        }

        .otp {
            font-size: 42px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }

        .note {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .footer {
            font-size: 13px;
            color: #999;
            margin-top: 40px;
        }

        a {
            color: #1a5eff;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px 10px;
                padding: 30px 20px;
            }

            .otp {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo"><img src="https://vc-thumbnails.blr1.cdn.digitaloceanspaces.com/studentpeeps/logos/sp_logo_full.png" alt=""></div>
    <div class="subtitle">One-time passcode</div>
    <div class="otp">{{otp}}</div>
    <div class="note">Here is your passcode.<br>It will expire in 5 minutes.</div>

    <div class="footer">
        For help with your <strong>StudentPeeps</strong> iD, please contact 
        <a href="mailto:hi@studentpeeps.club">support</a>
    </div>
</div>

</body>
</html>
