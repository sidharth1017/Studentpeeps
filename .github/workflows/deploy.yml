name: 🚀 Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'studentpeeps_v3'
        type: string
      run_migrations:
        description: 'Run database migrations?'
        required: false
        default: 'true'
        type: boolean

jobs:
  deploy:
    name: Deploy branch "${{ inputs.branch }}" to Droplet
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via SSH
        env:
          BRANCH: ${{ inputs.branch }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
            BRANCH="$BRANCH" RUN_MIGRATIONS="$RUN_MIGRATIONS" bash << 'EOF'
            set -e

            echo "📂 Navigating to project directory..."
            cd /var/www/Studentpeeps

            echo "🌿 Fetching all remote branches..."
            git fetch origin

            echo "🔀 Switching to branch: $BRANCH"
            git checkout "$BRANCH"

            echo "⬇️  Pulling latest changes from origin/$BRANCH..."
            git pull origin "$BRANCH"

            echo "📦 Installing/updating Python dependencies..."
            source venv/bin/activate || true
            pip install -r requirements.txt --quiet

            echo "🖼️  Collecting static files..."
            python manage.py collectstatic --noinput

            if [ "$RUN_MIGRATIONS" = "true" ]; then
              echo "🗃️  Running database migrations..."
              python manage.py migrate --noinput
            else
              echo "⏭️  Skipping migrations (disabled by user)"
            fi

            echo "🔄 Restarting Gunicorn service..."
            systemctl restart gunicorn

            echo "✅ Deployment of branch '$BRANCH' complete!"
          EOF
